name: Store screenshots

# Run by hand (Actions → Store screenshots → Run workflow). Builds the app without ads,
# starts a phone emulator and saves screenshots in three languages as a downloadable artifact.
on:
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build without ads
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug -PnoAds

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash tools/screenshots/take.sh app/build/outputs/apk/debug/app-debug.apk screenshots

      - uses: actions/upload-artifact@v4
        with:
          name: store-screenshots
          path: screenshots/
