name: Build APK and App Bundle

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # The upload key lives only in GitHub secrets (Settings → Secrets and variables → Actions).
      - name: Restore signing key
        id: signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "RELEASE_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::RELEASE_KEYSTORE_BASE64 is not set, so the release build is unsigned and won't be published."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ vars.ADMOB_BANNER_ID }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk rosso-remote.apk
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk rosso-remote-unsigned.apk
          fi
          cp app/build/outputs/bundle/release/app-release.aab rosso-remote.aab
          rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: rosso-remote
          path: |
            rosso-remote*.apk
            rosso-remote.aab

      - name: Publish release
        if: github.event_name != 'pull_request' && steps.signing.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.1.${{ github.run_number }}" rosso-remote.apk rosso-remote.aab \
            --title "Rosso Remote 1.1.${{ github.run_number }}" \
            --notes "Built from ${{ github.sha }}. Phones: download rosso-remote.apk and open it to install. Google Play: upload rosso-remote.aab in Play Console."
