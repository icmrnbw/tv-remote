name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk rosso-remote.apk

      - uses: actions/upload-artifact@v4
        with:
          name: rosso-remote
          path: rosso-remote.apk

      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" rosso-remote.apk \
            --title "Rosso Remote 1.0.${{ github.run_number }}" \
            --notes "Built from ${{ github.sha }}. Download rosso-remote.apk on your phone and open it to install."
